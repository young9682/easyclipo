[package]
name = "easyclip-sync-server"
version = "0.1.0"
description = "EasyClip 跨端同步服务器"
authors = ["young86"]
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-tungstenite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
