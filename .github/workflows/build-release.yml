name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-24.04
            bundles: "deb,appimage"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Switch Ubuntu mirror (azure archive 偶发不可达)
        if: runner.os == 'Linux'
        run: |
          sudo sed -i -E 's#http://(azure\.archive|archive)\.ubuntu\.com/ubuntu#https://mirrors.edge.kernel.org/ubuntu#g' \
            /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          grep -rh "^URIs\|^deb " /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null | head -3

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for i in 1 2 3; do
            timeout 240 sudo apt-get update -o Acquire::Retries=5 && break
            [ "$i" -eq 3 ] && exit 1
            sleep 10
          done
          for i in 1 2 3; do
            timeout 600 sudo apt-get install -y -o Acquire::Retries=5 \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
              librsvg2-dev patchelf && break
            [ "$i" -eq 3 ] && exit 1
            sleep 10
          done

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build (tauri)
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: bundles

      - name: List bundles
        run: ls -la bundles/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bundles/**/*.exe
            bundles/**/*.deb
            bundles/**/*.AppImage
          generate_release_notes: true
